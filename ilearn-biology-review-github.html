<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILEARN Biology Review (Practice)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f6f7;
  --surface: #ffffff;
  --ink: #10262b;
  --muted: #4a6168;
  --line: #cbd9dc;
  --stain: #b3175a;
  --stain-soft: #fbe6ef;
  --blue: #1f4f96;
  --ok: #17693f;
  --ok-soft: #e1f3e8;
  --bad: #9c2a1e;
  --bad-soft: #fbe9e6;
  --focus: #1f4f96;
  --on-stain: #ffffff;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1e;
    --surface: #14262b;
    --ink: #e8f1f3;
    --muted: #9db4ba;
    --line: #2b434a;
    --stain: #f06aa2;
    --stain-soft: #3a1b2b;
    --blue: #7fb0f2;
    --ok: #6fd69a;
    --ok-soft: #153325;
    --bad: #ff9a8c;
    --bad-soft: #3a1c18;
    --focus: #7fb0f2;
    --on-stain: #1a0a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1e;
  --surface: #14262b;
  --ink: #e8f1f3;
  --muted: #9db4ba;
  --line: #2b434a;
  --stain: #f06aa2;
  --stain-soft: #3a1b2b;
  --blue: #7fb0f2;
  --ok: #6fd69a;
  --ok-soft: #153325;
  --bad: #ff9a8c;
  --bad-soft: #3a1c18;
  --focus: #7fb0f2;
  --on-stain: #1a0a12;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 1.0625rem;
  line-height: 1.55;
}
main { max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1, h2 {
  font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  line-height: 1.1;
  margin: 0;
}
h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; }
.lede { color: var(--muted); margin: 0.75rem 0 1.75rem; max-width: 34rem; }
.namebox { display: grid; gap: 0.35rem; margin-bottom: 2.25rem; max-width: 24rem; }
.namebox label { font-weight: 700; }
input[type="text"], input[type="password"] {
  font: inherit; color: inherit; background: var(--surface);
  border: 2px solid var(--line); border-radius: 6px; padding: 0.6rem 0.75rem; width: 100%;
}
input[type="text"]:focus-visible, input[type="password"]:focus-visible, button:focus-visible, .opt input:focus-visible + span {
  outline: 3px solid var(--focus); outline-offset: 2px;
}
.status { font-size: 0.9375rem; color: var(--muted); min-height: 1.4em; }
.status.warn { color: var(--bad); }

fieldset.q { border: 0; border-top: 2px solid var(--line); margin: 0; padding: 1.5rem 0 1.75rem; min-width: 0; }
fieldset.q legend { padding: 0; float: left; width: 100%; }
.qhead { display: grid; grid-template-columns: 2.6rem 1fr; gap: 0.25rem 0.5rem; margin-bottom: 0.9rem; }
.qnum { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.7rem; color: var(--stain); line-height: 1.1; }
.topic { grid-column: 2; font-size: 0.9375rem; color: var(--blue); font-weight: 700; }
.qtext { grid-column: 2; font-weight: 700; }
.qbody { clear: both; padding-left: 3.1rem; }
@media (max-width: 30rem) { .qbody { padding-left: 0; } }

table.data { border-collapse: collapse; margin: 0 0 1rem; font-size: 0.9375rem; }
table.data th, table.data td { border: 1px solid var(--line); padding: 0.3rem 0.8rem; text-align: left; }
table.data th { background: var(--surface); }
table.data caption { text-align: left; color: var(--muted); padding-bottom: 0.35rem; }

.opt { display: block; margin: 0.45rem 0; cursor: pointer; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt span {
  display: block; padding: 0.7rem 0.9rem; border: 2px solid var(--line);
  border-radius: 6px; background: var(--surface);
}
.opt:hover span { border-color: var(--blue); }
.opt input:checked + span { border-color: var(--stain); background: var(--stain-soft); }
.locked .opt { cursor: default; }
.locked .opt:hover span { border-color: var(--line); }
.locked .opt input:checked + span { border-color: var(--stain); }
.opt.right span { border-color: var(--ok) !important; background: var(--ok-soft) !important; }
.opt.wrong span { border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.tag { font-weight: 700; margin-right: 0.4rem; }
.explain { margin: 0.75rem 0 0; padding-left: 0.9rem; border-left: 4px solid var(--blue); color: var(--ink); }
.explain strong { display: block; }

.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; border-top: 2px solid var(--line); padding-top: 1.5rem; }
button {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: 6px;
  padding: 0.75rem 1.4rem; border: 2px solid var(--stain); background: var(--stain); color: var(--on-stain);
}
button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
button:disabled { opacity: 0.55; cursor: not-allowed; }

.result { display: none; margin: 0 0 2.25rem; }
.result.show { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: center; }
@media (max-width: 30rem) { .result.show { grid-template-columns: 1fr; justify-items: start; } }
.ring { width: 9.5rem; height: 9.5rem; }
.ring text { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; fill: var(--ink); }
.result h2 { font-size: 1.6rem; margin-bottom: 0.35rem; }
.result p { margin: 0.2rem 0; color: var(--muted); }

#teacher { display: none; margin-top: 3rem; border-top: 2px solid var(--line); padding-top: 1.5rem; }
#teacher.show { display: block; }
#teacher h2 { font-size: 1.4rem; margin-bottom: 0.75rem; }
#teacher table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; }
#teacher th, #teacher td { border-bottom: 1px solid var(--line); padding: 0.4rem 0.5rem; text-align: left; }
.scroll { overflow-x: auto; }
.lockscreen {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
}
.lockscreen[hidden] { display: none; }
.lockinner { max-width: 26rem; width: 100%; }
.lockinner:focus { outline: none; }
.lockinner h2 { font-size: 2.2rem; color: var(--stain); margin-bottom: 0.75rem; }
.lockinner p { margin: 0 0 1.25rem; }
.pinrow { display: flex; gap: 0.6rem; margin-top: 0.35rem; }
.pinrow input { flex: 1; min-width: 0; }
.pinbox { margin: 1.25rem 0 0; max-width: 26rem; }
.pinbox label { font-weight: 700; }
.idlewarn {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--stain); color: var(--on-stain);
  font-weight: 700; text-align: center; padding: calc(0.6rem + env(safe-area-inset-top, 0px)) 1rem 0.6rem;
}
.idlewarn[hidden] { display: none; }
.pill { font-weight: 700; color: var(--bad); }
@media (prefers-reduced-motion: no-preference) {
  .ring .arc { transition: stroke-dashoffset 0.9s ease-out; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>ILEARN Biology review</h1>
    <p class="lede">Ten questions on cells, genetics, evolution, ecology, and data. You will see the answer and a short explanation for each one when you finish. This is a practice copy, so scores are not saved.</p>
  </header>

  <div id="resultBox" class="result" aria-live="polite" tabindex="-1"></div>

  <form id="quiz" onsubmit="return false"></form>

  <div class="actions">
    <button id="submitBtn" type="button">Check my answers</button>
    <button id="retryBtn" type="button" class="secondary" hidden>Try again</button>
    <span id="status" class="status" role="status"></span>
  </div>

</main>

<script>
(function () {
  var QUIZ_ID = "ilearn-bio-review-1";
  var LETTERS = ["A", "B", "C", "D"];

  var QUESTIONS = [
    { topic: "Cell transport",
      q: "A red blood cell is placed in a beaker of distilled water. What will most likely happen to the cell?",
      o: ["It will shrink because water leaves the cell.",
          "It will swell and may burst because water moves into the cell.",
          "It will stay the same because the cell membrane blocks all water.",
          "It will shrink because salt moves out by active transport."],
      a: 1,
      e: "Distilled water has no dissolved solutes, so water moves into the cell by osmosis, a type of passive transport. The cell swells and may burst." },
    { topic: "Enzymes",
      q: "An enzyme works best at 37 °C. At 80 °C its activity drops to almost zero. What is the best explanation?",
      o: ["The enzyme was used up in the reaction.",
          "High temperature added energy the enzyme needed to start working.",
          "High temperature changed the enzyme’s shape, so the substrate no longer fits the active site.",
          "The substrate changed into a different enzyme."],
      a: 2,
      e: "Heat breaks the bonds that hold an enzyme in its shape (denaturing). Enzymes are not used up, and the active site no longer matches the substrate." },
    { topic: "Cellular energy",
      q: "Which process takes place in the mitochondria and releases most of the ATP a cell makes?",
      o: ["Cellular respiration", "Photosynthesis", "Fermentation", "DNA replication"],
      a: 0,
      e: "Cellular respiration breaks down glucose with oxygen in the mitochondria. Fermentation happens in the cytoplasm and makes far less ATP." },
    { topic: "DNA and protein synthesis",
      q: "A segment of the DNA template strand reads TAC GGA. What is the mRNA sequence made from it?",
      o: ["ATG CCT", "UAC GGA", "AUG GGU", "AUG CCU"],
      a: 3,
      e: "RNA pairs A with U and C with G, and RNA uses uracil instead of thymine. TAC becomes AUG and GGA becomes CCU." },
    { topic: "Genetics",
      q: "In pea plants, tall (T) is dominant to short (t). A heterozygous tall plant is crossed with a short plant. What percent of the offspring are expected to be short?",
      o: ["0%", "25%", "50%", "100%"],
      a: 2,
      e: "Tt × tt gives Tt, Tt, tt, tt. Half of the offspring are tt, so half are short." },
    { topic: "Mutations",
      q: "Which mutation is most likely to change every amino acid after the mutation site?",
      o: ["The deletion of one nucleotide",
          "The substitution of one nucleotide for another",
          "The insertion of three nucleotides",
          "A substitution that codes for the same amino acid"],
      a: 0,
      e: "Codons are read in groups of three. Deleting one nucleotide shifts the reading frame for everything after it. A substitution changes at most one amino acid." },
    { topic: "Natural selection",
      q: "A hospital treats a bacterial infection with an antibiotic. Over several years the antibiotic becomes less effective. Which statement best explains this change?",
      o: ["Bacteria chose to develop resistance after being exposed to the drug.",
          "Bacteria with resistance already in the population survived, reproduced, and passed the trait to offspring.",
          "The antibiotic caused new resistance genes to appear in every bacterium.",
          "Bacteria became stronger because they used their defenses more."],
      a: 1,
      e: "Variation already exists in the population. The drug selects for resistant bacteria, which reproduce and pass the trait on." },
    { topic: "Energy in ecosystems",
      q: "A grassland’s producers hold 10,000 kJ of energy. Using the 10% rule, about how much energy is available to secondary consumers?",
      o: ["1,000 kJ", "10,000 kJ", "100 kJ", "10 kJ"],
      a: 2,
      e: "Producers have 10,000 kJ, primary consumers get about 1,000 kJ, and secondary consumers get about 100 kJ. The rest is lost as heat or used for life processes." },
    { topic: "Homeostasis",
      q: "During exercise a person’s body temperature rises and they begin to sweat. The sweat cools the body back toward normal. This is an example of:",
      o: ["Positive feedback, because the response increases the change",
          "Natural selection, because the body adapts over generations",
          "Passive transport, because sweat moves down its concentration gradient",
          "Negative feedback, because the response reduces the change"],
      a: 3,
      e: "Negative feedback reverses a change and returns the body toward its set point. Positive feedback would push the change further." },
    { topic: "Interpreting data",
      q: "A student grew bean plants with different amounts of fertilizer and measured the height after 3 weeks. Which conclusion is best supported by the data?",
      table: { caption: "Average height of 5 plants per group",
               head: ["Fertilizer (g)", "Height (cm)"],
               rows: [["0", "12"], ["5", "18"], ["10", "24"], ["15", "15"]] },
      o: ["More fertilizer always increases plant growth.",
          "Fertilizer has no effect on plant growth.",
          "Growth increased up to 10 g of fertilizer, but 15 g produced less growth than 10 g.",
          "The plants with 0 g of fertilizer are the experimental group."],
      a: 2,
      e: "The data rise from 0 g to 10 g and then fall at 15 g, so “always” goes too far. The 0 g group is the control, not the experimental group." }
  ];

  var form = document.getElementById("quiz");
  var statusEl = document.getElementById("status");
  var submitBtn = document.getElementById("submitBtn");
  var retryBtn = document.getElementById("retryBtn");
  var resultBox = document.getElementById("resultBox");

  var locked = false;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function render() {
    var html = "";
    QUESTIONS.forEach(function (Q, i) {
      html += '<fieldset class="q" id="q' + i + '"><legend><div class="qhead"><span class="qnum">' + (i + 1) +
        '</span><span class="topic">' + esc(Q.topic) + '</span><span class="qtext">' + esc(Q.q) + '</span></div></legend><div class="qbody">';
      if (Q.table) {
        html += '<table class="data"><caption>' + esc(Q.table.caption) + '</caption><thead><tr>' +
          Q.table.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          Q.table.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
          "</tbody></table>";
      }
      Q.o.forEach(function (t, j) {
        html += '<label class="opt" id="o' + i + "_" + j + '"><input type="radio" name="q' + i + '" value="' + j + '"><span><b class="tag">' +
          LETTERS[j] + '.</b>' + esc(t) + "</span></label>";
      });
      html += '<div class="explain" id="x' + i + '" hidden></div></div></fieldset>';
    });
    form.innerHTML = html;
  }

  function getAnswers() {
    return QUESTIONS.map(function (_, i) {
      var c = form.querySelector('input[name="q' + i + '"]:checked');
      return c ? parseInt(c.value, 10) : -1;
    });
  }

  function setStatus(msg, warn) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (warn ? " warn" : "");
  }

  function showResult(score, total) {
    var pct = score / total;
    var C = 2 * Math.PI * 52;
    var msg = pct >= 0.8 ? "Strong work." : pct >= 0.6 ? "Getting there." : "Keep practicing.";
    var sub = pct >= 0.8 ? "Read the explanations for any you missed."
            : "Review the explanations below, then try again.";
    resultBox.innerHTML =
      '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Score ' + score + ' out of ' + total + '">' +
      '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>' +
      '<circle class="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--stain)" stroke-width="10" stroke-linecap="round" ' +
      'transform="rotate(-90 60 60)" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/>' +
      '<text x="60" y="68" text-anchor="middle" font-size="30">' + score + "/" + total + "</text></svg>" +
      "<div><h2>" + msg + "</h2><p>You got " + score + " of " + total + " correct.</p><p>" + sub + "</p></div>";
    resultBox.classList.add("show");
    var arc = resultBox.querySelector(".arc");
    requestAnimationFrame(function () { requestAnimationFrame(function () { arc.setAttribute("stroke-dashoffset", String(C * (1 - pct))); }); });
    resultBox.focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function grade(answers) {
    var score = 0;
    QUESTIONS.forEach(function (Q, i) {
      var picked = answers[i];
      var right = picked === Q.a;
      if (right) score++;
      QUESTIONS[i].o.forEach(function (_, j) {
        var el = document.getElementById("o" + i + "_" + j);
        el.classList.remove("right", "wrong");
        var tag = el.querySelector(".tag");
        tag.textContent = LETTERS[j] + ".";
        if (j === Q.a) { el.classList.add("right"); tag.textContent = "Correct. " + LETTERS[j] + "."; }
        else if (j === picked) { el.classList.add("wrong"); tag.textContent = "Your answer. " + LETTERS[j] + "."; }
      });
      var x = document.getElementById("x" + i);
      x.hidden = false;
      x.innerHTML = "<strong>" + (right ? "Correct." : picked === -1 ? "Not answered." : "Not quite.") + "</strong>" + esc(Q.e);
    });
    return score;
  }

  function lock(on) {
    locked = on;
    form.classList.toggle("locked", on);
    form.querySelectorAll("input").forEach(function (inp) { inp.disabled = on; });
    submitBtn.hidden = on;
    retryBtn.hidden = !on;
  }

  submitBtn.addEventListener("click", function () {
    var answers = getAnswers();
    var blanks = answers.filter(function (a) { return a < 0; }).length;
    if (blanks > 0) {
      var first = answers.indexOf(-1);
      setStatus(blanks + (blanks === 1 ? " question is" : " questions are") + " not answered. Answer all 10 to check.", true);
      document.getElementById("q" + first).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    submitBtn.disabled = true;
    var score = grade(answers);
    lock(true);
    submitBtn.disabled = false;
    showResult(score, QUESTIONS.length);
    setStatus("Read the explanations below each question.");
  });

  retryBtn.addEventListener("click", function () {
    form.querySelectorAll("input").forEach(function (inp) { inp.checked = false; });
    document.querySelectorAll(".opt").forEach(function (el) { el.classList.remove("right", "wrong"); });
    document.querySelectorAll(".explain").forEach(function (el) { el.hidden = true; });
    QUESTIONS.forEach(function (Q, i) { Q.o.forEach(function (_, j) { document.getElementById("o" + i + "_" + j).querySelector(".tag").textContent = LETTERS[j] + "."; }); });
    resultBox.classList.remove("show");
    lock(false);
    setStatus("");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  render();
})();
</script>
</body>
</html>
